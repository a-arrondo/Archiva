<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 14px;
      min-width: 250px;
      font-family: system-ui, sans-serif;
      background: #0f0f1a;
      color: #e8e8f0;
    }
    h3 {
      margin: 0 0 4px;
      font-size: 18px;
      color: #e8e8f0;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    #current-url {
      font-size: 11px; color: #9090b0; word-break: break-all;
      margin-bottom: 14px; max-height: 36px; overflow: hidden;
      font-style: italic;
    }
    .mirror-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .mirror-row label { font-size: 11px; color: #b0b0cc; white-space: nowrap; font-weight: 500; }
    .mirror-hint { font-size: 10px; color: #7070a0; margin-bottom: 14px; line-height: 1.5; }
    select {
      flex: 1; padding: 5px 8px; background: #1c1c2e; color: #e8e8f0;
      border: 1px solid #3a3a5c; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    select:focus { outline: none; border-color: #e63946; }
    .btn-row { display: flex; gap: 8px; }
    button {
      flex: 1; padding: 10px; background: #e63946; color: #fff; border: none;
      border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover { background: #c1121f; }
    button:active { transform: scale(0.97); }
    button:disabled { background: #3a3a5c; color: #6060a0; cursor: not-allowed; }
    #copy-btn {
      background: #252540; flex: 0 0 auto; width: 100px; font-size: 12px;
      border: 1px solid #3a3a5c; color: #b0b0cc;
    }
    #copy-btn:hover:not(:disabled) { background: #30305a; color: #e8e8f0; }
    .footer { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
    .gh-link {
      font-size: 10px; color: #7070a0;
      text-decoration: underline; text-underline-offset: 2px;
    }
    .gh-link:hover { color: #b0b0cc; }
    .author { font-size: 10px; color: #7070a0; }

    /* Ping indicator */
    #ping-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #7070a0;
      margin-bottom: 6px;
      transition: opacity 0.3s, max-height 0.3s, margin-bottom 0.3s;
      max-height: 20px;
      overflow: hidden;
    }
    #ping-indicator.hidden {
      opacity: 0;
      pointer-events: none;
      max-height: 0;
      margin-bottom: 0;
    }
    .ping-dots {
      display: flex;
      gap: 3px;
    }
    .ping-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #e63946;
      animation: ping-bounce 1.2s ease-in-out infinite;
    }
    .ping-dots span:nth-child(2) { animation-delay: 0.2s; }
    .ping-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes ping-bounce {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40%            { opacity: 1;   transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <h3><img src="./icons/icon24.png" width="24" height="24" style="vertical-align: middle; margin-right: 6px;"><span data-i18n="heading"></span></h3>
  <div id="current-url" data-i18n="loading"></div>
  <div data-i18n="description" style="font-size:11px; color:#9090b0; margin-bottom:10px; line-height:1.5;"></div>
  <div class="mirror-row">
    <label data-i18n="mirrorLabel" for="mirror-select"></label>
    <select id="mirror-select"></select>
  </div>
  <div id="ping-indicator">
    <div class="ping-dots"><span></span><span></span><span></span></div>
    <span data-i18n="pinging">Checking mirrors…</span>
  </div>
  <div class="mirror-hint" data-i18n="mirrorHint"></div>
  <div class="btn-row">
    <button id="archive-btn" data-i18n="archiveBtn"></button>
    <button id="copy-btn" data-i18n="copyBtn"></button>
  </div>
  <div class="footer">
    <a class="gh-link" href="https://github.com/a-arrondo/Archiva" target="_blank" data-i18n="moreInfo"></a>
    <div class="author"></div>
  </div>
  <div style="text-align: center; margin-top: 6px;">
    <a href="https://www.flaticon.com/free-icons/files-and-folders"
      title="files and folders icons"
      target="_blank"
      class="flaticon-link"
      style="font-size: 9px; color: #7070a0;">
    </a>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
